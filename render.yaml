services:
  - type: web
    name: label-qc-verifier
    env: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: label-qc-db
          property: connectionString

databases:
  - name: label-qc-db
    databaseName: qc_db
    user: qc_user
    plan: basic-1gb
    region: frankfurt
