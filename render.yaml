services:
  - type: web
    name: label-qc-verifier
    env: docker
    plan: starter
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: label-qc-db
          property: connectionString

databases:
  - name: label-qc-db
    databaseName: qc_db
    user: qc_user
    plan: starter
    region: frankfurt
