services:
  - type: web
    name: label-qc-verifier
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: label-qc-db
          property: connectionString

databases:
  - name: label-qc-db
    databaseName: qc_db
    user: qc_user
    plan: basic-1gb
    region: frankfurt
