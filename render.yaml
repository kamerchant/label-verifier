services:
  - type: web
    name: label-qc-verifier
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: label-qc-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: MAX_UPLOAD_BYTES
        value: "262144000"

databases:
  - name: label-qc-db
    databaseName: qc_db
    user: qc_user
    plan: basic-1gb
    region: frankfurt
