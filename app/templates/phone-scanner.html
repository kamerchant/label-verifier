<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Phone Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at top, rgba(94, 106, 210, 0.16), transparent 46%),
                #0d1017;
            color: #e6eaf2;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 440px);
            padding: 20px;
            border: 1px solid #2c3343;
            border-radius: 14px;
            background: linear-gradient(160deg, #171b26, #12151d 72%);
            box-shadow: 0 20px 60px rgb(0 0 0 / 28%);
        }
        h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.025em; }
        p { color: #aab4c5; line-height: 1.45; }
        #job { margin-top: 0; }
        #scanner {
            width: min(100%, 320px);
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #343c50;
            border-radius: 10px;
            background: #10131b;
        }
        #scanner video { object-fit: cover; }
        .mode-toolbar { display: flex; gap: 8px; margin: 16px 0 12px; }
        button {
            border: 1px solid #394156;
            border-radius: 8px;
            padding: 10px 12px;
            background: #1d2230;
            color: #dce2ee;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 120ms ease, border-color 120ms ease;
        }
        button[aria-pressed="true"], .primary {
            border-color: #7480ef;
            background: #5e6ad2;
            color: #fff;
        }
        button:not(:disabled):hover { border-color: #6875e5; }
        button:disabled { opacity: .5; }
        #ocr-viewport {
            position: relative;
            width: min(100%, 320px);
            height: 160px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #343c50;
            border-radius: 10px;
            background: #10131b;
        }
        #ocr-video { display: block; width: 100%; height: 100%; object-fit: cover; }
        #ocr-guide {
            position: absolute;
            inset: 17% 3%;
            border: 2px solid #6ee7b7;
            border-radius: 5px;
            box-shadow: 0 0 0 999px rgb(8 11 17 / 48%);
            pointer-events: none;
        }
        #ocr-controls { margin-top: 12px; }
        #ocr-controls p { margin: 0 0 10px; font-size: 13px; }
        #ocr-input {
            width: 100%;
            min-height: 68px;
            margin: 8px 0;
            padding: 10px;
            border: 1px solid #394156;
            border-radius: 8px;
            background: #10131b;
            color: #e6eaf2;
            font: 15px ui-monospace, monospace;
            resize: vertical;
        }
        #ocr-input:focus { outline: 2px solid rgb(94 106 210 / 45%); border-color: #7480ef; }
        #status { min-height: 24px; color: #a5b4fc; }
        #status.error { color: #fca5a5; }
        #last-code { overflow-wrap: anywhere; color: #e6eaf2; font-family: ui-monospace, monospace; }
        #terminal-message {
            width: min(100%, 440px);
            padding: 24px;
            border: 1px solid #2c3343;
            border-radius: 14px;
            background: #171b26;
            text-align: center;
            line-height: 1.5;
        }
        @media (max-width: 380px) {
            main { padding: 16px; }
            .mode-toolbar { gap: 6px; }
            .mode-toolbar button { flex: 1; padding: 9px 7px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <main id="scanner-app" hidden>
        <h1>Phone scanner</h1>
        <p id="job">Connecting to desktop…</p>
        <div class="mode-toolbar" role="group" aria-label="Scanner mode">
            <button type="button" data-mode="barcode" aria-pressed="true">Barcode / QR</button>
            <button type="button" data-mode="ocr" aria-pressed="false">Printed text (OCR)</button>
        </div>
        <div id="scanner"></div>
        <div id="ocr-viewport" hidden>
            <video id="ocr-video" autoplay playsinline muted></video>
            <div id="ocr-guide" aria-hidden="true"></div>
        </div>
        <div id="ocr-controls" hidden>
            <p>Align one line of printed code inside the guide and capture.</p>
            <button id="capture-ocr" type="button">Capture and read text</button>
            <textarea id="ocr-input" autocomplete="off" placeholder="Recognized text appears here. Review or correct it before sending."></textarea>
            <button id="send-ocr" class="primary" type="button">Send text to desktop</button>
        </div>
        <button id="end-session" type="button" style="width:100%;margin-top:16px">End phone session</button>
        <p id="status" role="status" aria-live="polite">Connecting to desktop…</p>
        <p id="last-code" aria-live="polite"></p>
    </main>
    <div id="terminal-message" role="status" aria-live="polite">
        Initiate a connection request from the desktop app.
    </div>
    <script>
        const params = new URLSearchParams(window.location.hash.slice(1));
        const token = params.get('token');
        window.history.replaceState({}, document.title, window.location.pathname);
        const statusElement = document.getElementById('status');
        const jobElement = document.getElementById('job');
        const scannerApp = document.getElementById('scanner-app');
        const terminalMessage = document.getElementById('terminal-message');
        const barcodeViewport = document.getElementById('scanner');
        const ocrViewport = document.getElementById('ocr-viewport');
        const ocrVideo = document.getElementById('ocr-video');
        const ocrInput = document.getElementById('ocr-input');
        const modeButtons = [...document.querySelectorAll('[data-mode]')];
        let scanner = null;
        let ocrStream = null;
        let isSending = false;
        let isRecognizing = false;
        let isRunning = false;
        let currentMode = 'barcode';
        let sessionEnded = false;
        let heartbeatTimer = null;

        function setStatus(message, isError = false) {
            statusElement.textContent = message;
            statusElement.classList.toggle('error', isError);
        }

        function showTerminalMessage(message) {
            scannerApp.hidden = true;
            terminalMessage.textContent = message;
            terminalMessage.hidden = false;
        }

        async function postWithToken(path, extra = {}) {
            const body = new FormData();
            body.append('token', token);
            Object.entries(extra).forEach(([key, value]) => body.append(key, value));
            const response = await fetch(path, { method: 'POST', body });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || 'Phone scanner session has ended.');
            return data;
        }

        async function loadTesseract() {
            if (window.Tesseract) return window.Tesseract;
            if (!window.tesseractScriptPromise) {
                window.tesseractScriptPromise = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js';
                    script.onload = () => resolve(window.Tesseract);
                    script.onerror = () => {
                        window.tesseractScriptPromise = null;
                        reject(new Error('The text reader could not load. Check your internet connection and try again.'));
                    };
                    document.head.appendChild(script);
                });
            }
            return window.tesseractScriptPromise;
        }

        async function stopCamera() {
            let stopError = null;
            if (currentMode === 'barcode' && isRunning && scanner) {
                try {
                    await scanner.stop();
                } catch (error) {
                    stopError = error;
                }
            }
            isRunning = false;
            if (ocrStream) {
                ocrStream.getTracks().forEach(track => track.stop());
                ocrStream = null;
            }
            ocrVideo.srcObject = null;
            if (stopError) throw stopError;
        }

        async function startCamera() {
            if (isRunning || isSending || sessionEnded) return;
            if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
                setStatus('Camera scanning requires HTTPS and browser camera permission.', true);
                return;
            }
            try {
                if (currentMode === 'barcode') {
                    if (typeof Html5Qrcode === 'undefined') {
                        throw new Error('The scanner could not load. Check your connection and reload this page.');
                    }
                    if (!scanner) scanner = new Html5Qrcode('scanner');
                    await scanner.start(
                        { facingMode: 'environment' },
                        {
                            fps: 12,
                            aspectRatio: 1.65,
                            qrbox: (viewfinderWidth, viewfinderHeight) => ({
                                width: Math.min(300, Math.floor(viewfinderWidth * 0.88)),
                                height: Math.min(120, Math.floor(viewfinderHeight * 0.58))
                            })
                        },
                        sendScannedCode,
                        () => {}
                    );
                } else {
                    ocrStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: 'environment' } },
                        audio: false
                    });
                    ocrVideo.srcObject = ocrStream;
                    await ocrVideo.play();
                }
                isRunning = true;
                setStatus(currentMode === 'barcode'
                    ? 'Ready. Point the phone camera at a label.'
                    : 'Align one printed code line inside the guide, then capture.');
            } catch (error) {
                isRunning = false;
                if (ocrStream) {
                    ocrStream.getTracks().forEach(track => track.stop());
                    ocrStream = null;
                }
                ocrVideo.srcObject = null;
                setStatus(error.message || 'Could not start the phone camera.', true);
            }
        }

        async function switchMode(mode) {
            if (mode === currentMode || isSending || isRecognizing || sessionEnded) return;
            modeButtons.forEach(button => { button.disabled = true; });
            try {
                await stopCamera();
                currentMode = mode;
                modeButtons.forEach(button => {
                    button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
                });
                barcodeViewport.hidden = mode !== 'barcode';
                ocrViewport.hidden = mode !== 'ocr';
                document.getElementById('ocr-controls').hidden = mode !== 'ocr';
                await startCamera();
            } catch (error) {
                setStatus(error.message || 'Could not switch scanner mode.', true);
            } finally {
                modeButtons.forEach(button => { button.disabled = false; });
            }
        }

        async function captureOcrText() {
            if (isRecognizing || currentMode !== 'ocr') return;
            if (!ocrVideo.videoWidth || !ocrVideo.videoHeight) {
                setStatus('The camera image is not ready yet. Wait a moment and try again.', true);
                return;
            }
            const button = document.getElementById('capture-ocr');
            isRecognizing = true;
            button.disabled = true;
            ocrInput.value = '';
            setStatus('Preparing text reader…');
            try {
                const tesseract = await loadTesseract();
                const viewportBounds = ocrViewport.getBoundingClientRect();
                const guideBounds = document.getElementById('ocr-guide').getBoundingClientRect();
                const scale = Math.max(
                    viewportBounds.width / ocrVideo.videoWidth,
                    viewportBounds.height / ocrVideo.videoHeight
                );
                const renderedWidth = ocrVideo.videoWidth * scale;
                const renderedHeight = ocrVideo.videoHeight * scale;
                const offsetX = (viewportBounds.width - renderedWidth) / 2;
                const offsetY = (viewportBounds.height - renderedHeight) / 2;
                const sourceX = Math.max(0, (guideBounds.left - viewportBounds.left - offsetX) / scale);
                const sourceY = Math.max(0, (guideBounds.top - viewportBounds.top - offsetY) / scale);
                const sourceWidth = Math.min(ocrVideo.videoWidth - sourceX, guideBounds.width / scale);
                const sourceHeight = Math.min(ocrVideo.videoHeight - sourceY, guideBounds.height / scale);
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(sourceWidth);
                canvas.height = Math.round(sourceHeight);
                canvas.getContext('2d').drawImage(
                    ocrVideo,
                    sourceX, sourceY, sourceWidth, sourceHeight,
                    0, 0, canvas.width, canvas.height
                );
                setStatus('Reading printed text…');
                const result = await tesseract.recognize(canvas, 'eng', {
                    tessedit_pageseg_mode: '7',
                    logger: message => {
                        if (message.status === 'recognizing text' && message.progress) {
                            setStatus(`Reading printed text… ${Math.round(message.progress * 100)}%`);
                        }
                    }
                });
                const recognizedText = result.data.text.replace(/\s+/g, ' ').trim();
                if (!recognizedText) {
                    setStatus('No text detected. Improve focus or lighting, then capture again.', true);
                    return;
                }
                ocrInput.value = recognizedText;
                setStatus('Review or correct the recognized text before sending it.');
            } catch (error) {
                setStatus(error.message || 'Text recognition failed. Please try again.', true);
            } finally {
                isRecognizing = false;
                button.disabled = false;
            }
        }

        async function sendOcrText() {
            const code = ocrInput.value.trim();
            if (!code) {
                setStatus('Capture text or enter a correction before sending.', true);
                return;
            }
            await sendScannedCode(code);
            if (!statusElement.classList.contains('error')) ocrInput.value = '';
        }

        async function sendScannedCode(decodedText) {
            if (isSending || sessionEnded) return false;
            isSending = true;
            try {
                if (currentMode === 'barcode' && isRunning) await stopCamera();
                await postWithToken('/api/phone-scanner/scan', { code: decodedText });
                document.getElementById('last-code').textContent = decodedText;
                setStatus('Scan sent to desktop. Ready for the next label.');
                return true;
            } catch (error) {
                setStatus(error.message || 'Could not send the scan to desktop.', true);
                return false;
            } finally {
                isSending = false;
                if (currentMode === 'barcode') window.setTimeout(startCamera, 350);
            }
        }

        async function endPhoneSession() {
            if (sessionEnded) return;
            sessionEnded = true;
            clearInterval(heartbeatTimer);
            document.querySelectorAll('button').forEach(button => { button.disabled = true; });
            try {
                try {
                    await stopCamera();
                } catch (error) {
                    console.error('Could not stop the phone camera cleanly.', error);
                }
                await postWithToken('/api/phone-scanner/disconnect');
                showTerminalMessage('Phone scanner session ended.');
            } catch (error) {
                showTerminalMessage(error.message || 'Could not end the phone scanner session.');
            }
        }

        modeButtons.forEach(button => {
            button.addEventListener('click', () => switchMode(button.dataset.mode));
        });
        document.getElementById('capture-ocr').addEventListener('click', captureOcrText);
        document.getElementById('send-ocr').addEventListener('click', sendOcrText);
        document.getElementById('end-session').addEventListener('click', endPhoneSession);

        async function connect() {
            if (!token) {
                showTerminalMessage('Initiate a new connection request from the desktop app.');
                return;
            }
            try {
                const data = await postWithToken('/api/phone-scanner/connect');
                terminalMessage.hidden = true;
                scannerApp.hidden = false;
                jobElement.textContent = `Connected to Job Card ${data.job_card_id}`;
                await startCamera();
                heartbeatTimer = window.setInterval(async () => {
                    try {
                        await postWithToken('/api/phone-scanner/heartbeat');
                    } catch (error) {
                        if (sessionEnded) return;
                        sessionEnded = true;
                        clearInterval(heartbeatTimer);
                        document.querySelectorAll('button').forEach(button => { button.disabled = true; });
                        try {
                            await stopCamera();
                        } catch (stopError) {
                            console.error('Could not stop the phone camera cleanly.', stopError);
                        } finally {
                            showTerminalMessage('Phone scanner session ended.');
                        }
                    }
                }, 2000);
            } catch (error) {
                showTerminalMessage('This scanner link is invalid or has expired. Initiate a new connection request from the desktop app.');
            }
        }

        connect();
    </script>
</body>
</html>
