<!-- Upload Modal -->
<div id="upload-modal" class="fixed inset-0 bg-black/75 flex items-center justify-center hidden p-4 z-50">
    <div class="bg-slate-800 p-6 rounded-lg max-w-md w-full border border-slate-600 shadow-2xl">
        <h3 class="text-lg font-bold mb-4">Upload New Batch Data</h3>
        <form id="upload-form" onsubmit="uploadJob(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-300">Job Card #</label>
                <input type="text" id="new-job-id" required placeholder="e.g. JC-2026-99" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-300">Target Rows (extracts all columns)</label>
                <input type="text" id="target-rows" required placeholder="e.g. 1, 3, 5 or 1-50, 60 or odd" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                <p class="text-[11px] text-slate-400 mt-1">
                    Enter rows separated by commas (e.g. <code>1, 3, 5</code>) or type <code>odd</code> to pull all columns on every odd row.
                </p>
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-300">CSV or TXT File</label>
                <input type="file" id="new-job-file" accept=".csv,.txt" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="toggleUploadModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm">Cancel</button>
                <button type="submit" id="upload-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-semibold">Upload</button>
            </div>
        </form>
    </div>
</div>
